control:
  Package: kotlin-language-server
  Version: 1.3.13
  Architecture: all
  Maintainer: Amsit S (dezavue3@gmail.com)
  Depends: kotlin
  Homepage: https://github.com/amsitlab/termux-kotlin-lsp
  Description: Kotlin language server
installation_prefix: /data/data/com.termux/files/usr
data_files:
    /data/data/com.termux/files/home/.local/share/kotlin-language-server/bin/kotlin-language-server:
      source: server/bin/kotlin-language-server
      perm: 755

    /data/data/com.termux/files/home/.local/bin/kotlin-language-server:
      source: bin/kotlin-language-server
      perm: 755

    /data/data/com.termux/files/home/.local/share/kotlin-language-server/lib:
      source: server/lib
      source_recurse: true

    /data/data/com.termux/files/home/.config/kotlin-language-server/log4j2.xml:
      source: log4j2.xml
