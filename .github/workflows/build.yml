name: Build Kotlin Language Server for termux

on:
  push:
    branch:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 python3-pip curl unzip
          sudo pip3 install "ruamel.yaml<0.18.0"
          curl -LO https://github.com/termux/termux-create-package/releases/latest/download/termux-create-package
          chmod a+x ./termux-create-package

          curl -L "https://github.com/fwcd/kotlin-language-server/releases/download/1.3.13/server.zip" -o server.zip
          unzip server.zip
          tree -a
          cat server/bin/kotlin-language-server
      - name: Packaging
        id: packaging
        env:
          PKG_VERSION: 1.3.13
        run: |
          REVISION=$(date +%Y%m%d)
          rm -fr ./*.deb
          ./termux-create-package --pkg-version "${PKG_VERSION}-${REVISION}" manifest.yml
          echo "deb=kotlin-language-server_${PKG_VERSION}-${REVISION}_all.deb" >> $GITHUB_OUTPUT
          echo "version=${PKG_VERSION}-${REVISION}" >> $GITHUB_OUTPUT
          tree -a
      - name: Upload releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.packaging.outputs.deb }}
          tag_name: "v${{ steps.packaging.outputs.version }}"
          name: "Release ${{ steps.packaging.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

